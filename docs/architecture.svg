<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b3040"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c26d00"/>
    </marker>
    <style>
      .box{fill:#f4f6fa;stroke:#2b3040;stroke-width:1.6}
      .mem{fill:#e8f1ff;stroke:#2b3040;stroke-width:1.6}
      .ctl{fill:#fff3e0;stroke:#c26d00;stroke-width:1.6}
      .out{fill:#eaf7ea;stroke:#2e7d32;stroke-width:1.6}
      .w{stroke:#2b3040;stroke-width:1.6;fill:none}
      .cw{stroke:#c26d00;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .t{fill:#1b1e28;font-size:14px;font-weight:600;text-anchor:middle}
      .s{fill:#4a5063;font-size:11.5px;text-anchor:middle}
      .l{fill:#2b3040;font-size:11px}
      .cl{fill:#c26d00;font-size:11px}
      .dot{fill:#2b3040}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
  <text x="40" y="34" style="font-size:20px;font-weight:700;fill:#1b1e28">Venom CPU</text>
  <text x="40" y="54" class="l" style="font-size:12px">8-bit single-cycle CPU · multi-cycle MUL/DIV with stall</text>

  <!-- legend -->
  <line x1="880" y1="24" x2="920" y2="24" class="w" marker-end="url(#a)"/>
  <text x="928" y="28" class="l">data</text>
  <line x1="990" y1="24" x2="1030" y2="24" class="cw" marker-end="url(#c)"/>
  <text x="1038" y="28" class="cl">control</text>

  <!-- PC -->
  <rect x="40" y="180" width="120" height="80" rx="8" class="box"/>
  <text x="100" y="215" class="t">PC</text>
  <text x="100" y="234" class="s">pcounter</text>

  <!-- Instruction memory -->
  <rect x="200" y="170" width="140" height="100" rx="8" class="mem"/>
  <text x="270" y="208" class="t">Instruction</text>
  <text x="270" y="226" class="t">Memory</text>
  <text x="270" y="246" class="s">256 × 21 bit</text>

  <!-- Decoder -->
  <rect x="380" y="150" width="150" height="140" rx="8" class="box"/>
  <text x="440" y="176" class="t">Decoder</text>
  <text x="440" y="193" class="s">instructions</text>
  <text x="522" y="184" class="l" text-anchor="end">regA</text>
  <text x="522" y="209" class="l" text-anchor="end">regB</text>
  <text x="522" y="234" class="l" text-anchor="end">outreg</text>
  <text x="522" y="269" class="l" text-anchor="end">data</text>
  <text x="440" y="284" class="l" text-anchor="middle">opcode</text>

  <!-- Register file -->
  <rect x="590" y="130" width="150" height="180" rx="8" class="box"/>
  <text x="665" y="162" class="t">Register File</text>
  <text x="665" y="180" class="s">R0 – R7 (8 × 8 bit)</text>
  <text x="598" y="214" class="l">read A</text>
  <text x="598" y="239" class="l">read B</text>
  <text x="598" y="264" class="l">write sel</text>
  <text x="732" y="164" class="l" text-anchor="end" dy="0"> </text>
  <text x="733" y="199" class="l" text-anchor="end">A</text>
  <text x="733" y="239" class="l" text-anchor="end">B</text>

  <!-- ALU -->
  <rect x="800" y="120" width="150" height="130" rx="8" class="box"/>
  <text x="875" y="152" class="t">ALU</text>
  <text x="875" y="172" class="s">+  −  ^  &amp;  |  MOV</text>
  <text x="875" y="190" class="s">MUL / DIV (multi-cycle)</text>
  <text x="875" y="208" class="s">zero · done · ispoly</text>

  <!-- Data memory -->
  <rect x="800" y="300" width="150" height="100" rx="8" class="mem"/>
  <text x="875" y="338" class="t">Data Memory</text>
  <text x="875" y="357" class="s">256 × 8 bit (RAM)</text>
  <text x="810" y="392" class="l">addr</text>

  <!-- Write-back mux -->
  <polygon points="1000,150 1060,180 1060,300 1000,330" class="box"/>
  <text x="1030" y="236" class="t" style="font-size:13px">MUX</text>
  <text x="1030" y="254" class="s">3 : 1</text>
  <text x="1006" y="194" class="l">a</text>
  <text x="1006" y="354" class="l"> </text>

  <!-- Control unit -->
  <rect x="380" y="410" width="150" height="110" rx="8" class="ctl"/>
  <text x="455" y="440" class="t">Control Unit</text>
  <text x="455" y="460" class="s">wenable · store</text>
  <text x="455" y="476" class="s">select · beq · bne</text>
  <text x="455" y="492" class="s">jump · halt</text>

  <!-- Stall & branch logic -->
  <rect x="130" y="410" width="220" height="110" rx="8" class="ctl"/>
  <text x="240" y="440" class="t">Stall &amp; Branch Logic</text>
  <text x="240" y="460" class="s">runi flag (waits for MUL/DIV)</text>
  <text x="240" y="476" class="s">stall = MUL/DIV busy || HALT</text>
  <text x="240" y="492" class="s">jump || beq·zero || bne·!zero</text>

  <!-- Output -->
  <rect x="625" y="380" width="150" height="60" rx="8" class="out"/>
  <text x="700" y="405" class="t">top.v</text>
  <text x="700" y="424" class="s">~R1[5:0] → 6 LEDs</text>

  <!-- ===== data wires ===== -->
  <!-- PC -> IMEM -->
  <line x1="160" y1="220" x2="198" y2="220" class="w" marker-end="url(#a)"/>
  <text x="179" y="212" class="l" text-anchor="middle">8</text>
  <!-- IMEM -> Decoder -->
  <line x1="340" y1="220" x2="378" y2="220" class="w" marker-end="url(#a)"/>
  <text x="359" y="212" class="l" text-anchor="middle">21</text>
  <!-- Decoder -> regfile selects -->
  <line x1="530" y1="180" x2="588" y2="210" class="w" marker-end="url(#a)"/>
  <line x1="530" y1="205" x2="588" y2="235" class="w" marker-end="url(#a)"/>
  <line x1="530" y1="230" x2="588" y2="260" class="w" marker-end="url(#a)"/>
  <!-- opcode -> Control Unit -->
  <line x1="455" y1="290" x2="455" y2="408" class="w" marker-end="url(#a)"/>
  <!-- opcode -> ALU (over the top) -->
  <polyline points="470,150 470,100 875,100 875,118" class="w" marker-end="url(#a)"/>
  <text x="560" y="94" class="l">opcode</text>
  <!-- regfile A,B -> ALU -->
  <line x1="740" y1="195" x2="798" y2="165" class="w" marker-end="url(#a)"/>
  <line x1="740" y1="235" x2="798" y2="210" class="w" marker-end="url(#a)"/>
  <!-- A -> Data memory write data -->
  <polyline points="770,180 770,330 798,330" class="w" marker-end="url(#a)"/>
  <circle cx="770" cy="180" r="3" class="dot"/>
  <text x="776" y="320" class="l">data in</text>
  <!-- ALU result -> MUX a -->
  <line x1="950" y1="190" x2="998" y2="190" class="w" marker-end="url(#a)"/>
  <text x="956" y="182" class="l">result</text>
  <!-- RAM -> MUX b -->
  <polyline points="950,350 980,350 980,262 998,262" class="w" marker-end="url(#a)"/>
  <text x="1006" y="268" class="l">b</text>
  <!-- Write-back MUX -> register file (over the top) -->
  <polyline points="1060,240 1110,240 1110,70 665,70 665,128" class="w" marker-end="url(#a)"/>
  <text x="890" y="64" class="l">write-back data</text>
  <!-- data field bus -->
  <polyline points="530,265 550,265 550,590 70,590 70,262" class="w" marker-end="url(#a)"/>
  <line x1="550" y1="590" x2="1030" y2="590" class="w"/>
  <circle cx="550" cy="590" r="3" class="dot"/>
  <line x1="850" y1="590" x2="850" y2="402" class="w" marker-end="url(#a)"/>
  <circle cx="850" cy="590" r="3" class="dot"/>
  <line x1="1030" y1="590" x2="1030" y2="318" class="w" marker-end="url(#a)"/>
  <text x="1036" y="340" class="l">c</text>
  <text x="300" y="608" class="l">data field: branch target · RAM address · LDI immediate</text>
  <text x="76" y="300" class="l">target</text>
  <!-- R1 -> top/LEDs -->
  <line x1="700" y1="310" x2="700" y2="378" class="w" marker-end="url(#a)"/>
  <text x="706" y="348" class="l">R1</text>

  <!-- ===== control wires ===== -->
  <!-- CU -> stall/branch logic -->
  <line x1="380" y1="465" x2="352" y2="465" class="cw" marker-end="url(#c)"/>
  <!-- stall/branch -> PC -->
  <line x1="140" y1="410" x2="140" y2="262" class="cw" marker-end="url(#c)"/>
  <text x="146" y="330" class="cl">stall, jump</text>
  <!-- ALU flags -> stall logic (label only) -->
  <text x="178" y="400" class="cl">zero, done, ispoly ← ALU</text>
  <!-- control stubs -->
  <line x1="530" y1="440" x2="610" y2="440" class="cw"/>
  <line x1="610" y1="440" x2="610" y2="312" class="cw" marker-end="url(#c)"/>
  <text x="614" y="330" class="cl">wenable</text>
  <text x="614" y="343" class="cl">&amp; !stall</text>
  <polyline points="530,500 900,500 900,402" class="cw" marker-end="url(#c)"/>
  <text x="906" y="420" class="cl">store</text>
  <polyline points="530,510 1085,510 1085,160 1062,160" class="cw"/>
  <line x1="1085" y1="160" x2="1040" y2="160" class="cw" marker-end="url(#c)"/>
  <text x="1090" y="495" class="cl">select</text>
</svg>
