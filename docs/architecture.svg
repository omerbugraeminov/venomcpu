<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b3040"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c26d00"/>
    </marker>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b3fc4"/>
    </marker>
    <style>
      .box{fill:#f4f6fa;stroke:#2b3040;stroke-width:1.6}
      .mem{fill:#e8f1ff;stroke:#2b3040;stroke-width:1.6}
      .ctl{fill:#fff3e0;stroke:#c26d00;stroke-width:1.6}
      .fwd{fill:#f3ecfc;stroke:#7b3fc4;stroke-width:1.6}
      .out{fill:#eaf7ea;stroke:#2e7d32;stroke-width:1.6}
      .preg{fill:#2b3040}
      .band{fill:#f7f8fb}
      .w{stroke:#2b3040;stroke-width:1.6;fill:none}
      .cw{stroke:#c26d00;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .fw{stroke:#7b3fc4;stroke-width:1.6;fill:none}
      .t{fill:#1b1e28;font-size:14px;font-weight:600;text-anchor:middle}
      .s{fill:#4a5063;font-size:11.5px;text-anchor:middle}
      .l{fill:#2b3040;font-size:11px}
      .cl{fill:#c26d00;font-size:11px}
      .fl{fill:#7b3fc4;font-size:11px}
      .st{fill:#1b1e28;font-size:13px;font-weight:700;text-anchor:middle;letter-spacing:1px}
      .sts{fill:#6a7083;font-size:11px;text-anchor:middle}
      .pl{fill:#ffffff;font-size:10.5px;font-weight:600;text-anchor:middle}
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>
  <text x="30" y="36" style="font-size:20px;font-weight:700;fill:#1b1e28">Venom32-V</text>
  <text x="30" y="56" class="l" style="font-size:12px">32-bit RISC-V (RV32IM) · 5-stage pipeline (IF / ID / EX / MEM / WB) · forwarding · load-use stall · multi-cycle MUL/DIV · unified dual-port RAM</text>

  <!-- legend -->
  <line x1="1000" y1="30" x2="1036" y2="30" class="w" marker-end="url(#a)"/>
  <text x="1042" y="34" class="l">data</text>
  <line x1="1090" y1="30" x2="1126" y2="30" class="fw" marker-end="url(#f)"/>
  <text x="1132" y="34" class="fl">forwarding</text>
  <line x1="1210" y1="30" x2="1246" y2="30" class="cw" marker-end="url(#c)"/>
  <text x="1252" y="34" class="cl">control</text>
  <rect x="1310" y="22" width="8" height="16" class="preg"/>
  <text x="1324" y="34" class="l">pipeline reg</text>

  <!-- stage bands -->
  <rect x="20" y="78" width="220" height="560" rx="10" class="band"/>
  <rect x="268" y="78" width="372" height="560" rx="10" class="band"/>
  <rect x="668" y="78" width="292" height="560" rx="10" class="band"/>
  <rect x="988" y="78" width="222" height="560" rx="10" class="band"/>
  <rect x="1238" y="78" width="142" height="560" rx="10" class="band"/>
  <text x="130" y="100" class="st">IF</text><text x="130" y="116" class="sts">fetch</text>
  <text x="454" y="100" class="st">ID</text><text x="454" y="116" class="sts">decode · read registers</text>
  <text x="814" y="100" class="st">EX</text><text x="814" y="116" class="sts">execute · branch decision</text>
  <text x="1099" y="100" class="st">MEM</text><text x="1099" y="116" class="sts">data memory</text>
  <text x="1309" y="100" class="st">WB</text><text x="1309" y="116" class="sts">write back</text>

  <!-- pipeline registers -->
  <rect x="247" y="140" width="14" height="470" rx="3" class="preg"/>
  <text x="254" y="380" class="pl" transform="rotate(-90 254 380)">fetchreg</text>
  <rect x="647" y="140" width="14" height="470" rx="3" class="preg"/>
  <text x="654" y="380" class="pl" transform="rotate(-90 654 380)">ex registers</text>
  <rect x="967" y="140" width="14" height="470" rx="3" class="preg"/>
  <text x="974" y="380" class="pl" transform="rotate(-90 974 380)">mem registers</text>
  <rect x="1217" y="140" width="14" height="470" rx="3" class="preg"/>
  <text x="1224" y="380" class="pl" transform="rotate(-90 1224 380)">wbdata · wbreg · wbenable</text>

  <!-- IF -->
  <rect x="32" y="200" width="76" height="80" rx="8" class="box"/>
  <text x="70" y="236" class="t">PC</text>
  <text x="70" y="254" class="s">+4 / target</text>
  <rect x="124" y="185" width="108" height="110" rx="8" class="mem"/>
  <text x="178" y="222" class="t">RAM</text>
  <text x="178" y="240" class="t">port B</text>
  <text x="178" y="260" class="s">read instruction</text>
  <text x="178" y="276" class="s">addr = PC[9:2]</text>
  <line x1="108" y1="240" x2="122" y2="240" class="w" marker-end="url(#a)"/>
  <line x1="232" y1="240" x2="245" y2="240" class="w" marker-end="url(#a)"/>

  <!-- ID -->
  <rect x="280" y="150" width="140" height="110" rx="8" class="box"/>
  <text x="350" y="186" class="t">Decoder</text>
  <text x="350" y="204" class="s">instructions</text>
  <text x="350" y="232" class="l" text-anchor="middle">opcode · rs1 · rs2 · rd</text>
  <text x="350" y="247" class="l" text-anchor="middle">funct3/7 · imm</text>
  <line x1="261" y1="205" x2="278" y2="205" class="w" marker-end="url(#a)"/>

  <rect x="280" y="300" width="140" height="110" rx="8" class="ctl"/>
  <text x="350" y="336" class="t">Control Unit</text>
  <text x="350" y="354" class="s">controlunit</text>
  <text x="350" y="374" class="l" text-anchor="middle">regwrite · alusrc</text>
  <text x="350" y="388" class="l" text-anchor="middle">mem r/w · branch · jal(r)</text>
  <text x="350" y="402" class="l" text-anchor="middle">auipc · wbsel · aluop</text>
  <line x1="350" y1="260" x2="350" y2="298" class="w" marker-end="url(#a)"/>
  <line x1="420" y1="355" x2="645" y2="355" class="cw" marker-end="url(#c)"/>

  <rect x="460" y="150" width="160" height="150" rx="8" class="box"/>
  <text x="540" y="182" class="t">Register File</text>
  <text x="540" y="200" class="s">x0 – x31 (32 × 32 bit)</text>
  <text x="468" y="234" class="l">read A / read B</text>
  <text x="468" y="284" class="l">write (from WB)</text>
  <text x="612" y="252" class="l" text-anchor="end">x1 → LEDs</text>
  <line x1="420" y1="215" x2="458" y2="215" class="w" marker-end="url(#a)"/>

  <rect x="460" y="430" width="160" height="56" rx="8" class="fwd"/>
  <text x="540" y="454" class="t">ID forward</text>
  <text x="540" y="472" class="s">fwdA / fwdB ← wbdata</text>
  <line x1="540" y1="300" x2="540" y2="428" class="w" marker-end="url(#a)"/>
  <line x1="620" y1="458" x2="645" y2="458" class="w" marker-end="url(#a)"/>

  <rect x="280" y="520" width="340" height="76" rx="8" class="ctl"/>
  <text x="450" y="546" class="t">Hazard control</text>
  <text x="450" y="565" class="s">stall = MUL/DIV busy · loadstall = load → use</text>
  <text x="450" y="582" class="s">holds PC + fetchreg, puts bubbles into EX / MEM</text>

  <!-- EX -->
  <rect x="680" y="160" width="86" height="150" rx="8" class="fwd"/>
  <text x="723" y="200" class="t">EX</text>
  <text x="723" y="218" class="t">forward</text>
  <text x="723" y="244" class="s">MEM first,</text>
  <text x="723" y="259" class="s">then WB,</text>
  <text x="723" y="274" class="s">else exA/exB</text>
  <line x1="661" y1="235" x2="678" y2="235" class="w" marker-end="url(#a)"/>

  <rect x="790" y="150" width="160" height="170" rx="8" class="box"/>
  <text x="870" y="186" class="t">ALU</text>
  <text x="870" y="204" class="s">alu</text>
  <text x="870" y="226" class="l" text-anchor="middle">a = rs1 | PC · b = rs2 | imm</text>
  <text x="870" y="244" class="l" text-anchor="middle">ADD SUB SLL SRL SRA</text>
  <text x="870" y="258" class="l" text-anchor="middle">SLT SLTU XOR OR AND</text>
  <text x="870" y="276" class="l" text-anchor="middle">MUL* · DIV/REM*</text>
  <text x="870" y="292" class="l" text-anchor="middle">(multi-cycle, stall)</text><text x="870" y="308" class="l" text-anchor="middle">done flag</text>
  <line x1="766" y1="235" x2="788" y2="235" class="w" marker-end="url(#a)"/>
  <line x1="950" y1="235" x2="965" y2="235" class="w" marker-end="url(#a)"/>

  <rect x="790" y="350" width="160" height="110" rx="8" class="ctl"/>
  <text x="870" y="374" class="t">Branch unit</text>
  <text x="870" y="392" class="s">compare rs1, rs2 by funct3</text>
  <text x="870" y="408" class="s">EQ NE LT GE LTU GEU</text>
  <text x="870" y="426" class="s">target = PC + imm</text>
  <text x="870" y="442" class="s">JALR: (rs1 + imm) &amp; ~1</text>
  <line x1="870" y1="320" x2="870" y2="348" class="cw" marker-end="url(#c)"/>

  <!-- MEM -->
  <rect x="1000" y="150" width="198" height="120" rx="8" class="mem"/>
  <text x="1099" y="178" class="t">LSU + RAM port A</text>
  <text x="1099" y="196" class="s">1 KB unified RAM (code + data)</text>
  <text x="1099" y="220" class="l" text-anchor="middle">addr = memalu · data = memA</text>
  <text x="1099" y="236" class="l" text-anchor="middle">LB LH LW LBU LHU · SB SH SW</text>
  <text x="1099" y="252" class="l" text-anchor="middle">byte enables · sign extension</text>
  <line x1="981" y1="210" x2="998" y2="210" class="w" marker-end="url(#a)"/>

  <rect x="1000" y="300" width="198" height="80" rx="8" class="box"/>
  <text x="1099" y="328" class="t">Write-back Mux</text>
  <text x="1099" y="346" class="s">select = memwbsel</text>
  <text x="1099" y="364" class="l" text-anchor="middle">00 ALU · 01 LSU · 10 imm · 11 PC+4</text>
  <line x1="1099" y1="270" x2="1099" y2="298" class="w" marker-end="url(#a)"/>
  <line x1="981" y1="340" x2="998" y2="340" class="w" marker-end="url(#a)"/>
  <line x1="1198" y1="340" x2="1215" y2="340" class="w" marker-end="url(#a)"/>

  <rect x="1000" y="410" width="198" height="56" rx="8" class="fwd"/>
  <text x="1099" y="434" class="t">memfwd</text>
  <text x="1099" y="452" class="s">imm (LUI) · PC+4 (JAL) · ALU</text>
  <line x1="981" y1="438" x2="998" y2="438" class="w" marker-end="url(#a)"/>

  <!-- WB -->
  <rect x="1250" y="290" width="118" height="100" rx="8" class="out"/>
  <text x="1309" y="328" class="t">Register</text>
  <text x="1309" y="346" class="t">write</text>
  <text x="1309" y="368" class="s">R[wbreg] ← wbdata</text>
  <line x1="1231" y1="340" x2="1248" y2="340" class="w" marker-end="url(#a)"/>

  <!-- WB → register file write -->
  <path d="M1309,390 L1309,700 L590,700 L590,302" class="w" marker-end="url(#a)"/>
  <text x="900" y="694" class="l" text-anchor="middle">write-back to register file (+ ID forward)</text>

  <!-- forwarding paths into EX forward -->
  <path d="M1198,438 L1206,438 L1206,660 L723,660 L723,312" class="fw" marker-end="url(#f)"/>
  <text x="960" y="654" class="fl" text-anchor="middle">MEM → EX forward (memfwd)</text>
  <path d="M1240,360 L1240,680 L700,680 L700,312" class="fw" marker-end="url(#f)"/>
  <text x="960" y="676" class="fl" text-anchor="middle">WB → EX forward (wbdata)</text>

  <!-- branch → PC and flush -->
  <path d="M950,395 L958,395 L958,68 L70,68 L70,198" class="cw" marker-end="url(#c)"/>
  <text x="700" y="63" class="cl">taken branch / JAL / JALR → PC ← target, flush (2-cycle penalty)</text>

  <!-- hazard → PC / fetchreg -->
  <path d="M280,560 L50,560 L50,282" class="cw" marker-end="url(#c)"/>
  <text x="150" y="555" class="cl" text-anchor="middle">stall / loadstall</text>

  <text x="30" y="740" class="l" style="font-size:11.5px">Tang Nano 20K (GW2AR-18, Gowin): Fmax ≈ 63 MHz · ~3,300 LUTs (16%) · RAM in block RAM · RAM ports A and B are the same 1 KB memory</text>
</svg>
