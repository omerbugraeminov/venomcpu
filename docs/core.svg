<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="SF Pro Display, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="0.5" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <linearGradient id="pkg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3d46"/>
      <stop offset="0.5" stop-color="#1c1e24"/>
      <stop offset="1" stop-color="#34373f"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171d"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6fd6"/><stop offset="1" stop-color="#1a3f86"/></linearGradient>
    <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fb5c9"/><stop offset="1" stop-color="#0e6878"/></linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f29a3a"/><stop offset="1" stop-color="#a35a12"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fc46e"/><stop offset="1" stop-color="#1c7a40"/></linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6cf0"/><stop offset="1" stop-color="#5a33a8"/></linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e95aa0"/><stop offset="1" stop-color="#93245c"/></linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c547"/><stop offset="1" stop-color="#8f7514"/></linearGradient>
    <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b606c"/><stop offset="1" stop-color="#33363e"/></linearGradient>
    <pattern id="sram" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="none"/>
      <path d="M0,0 L10,0 M0,0 L0,10" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <pattern id="logic" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.8" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <pattern id="pins" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="8" height="8" rx="1.5" fill="#c9a24a" fill-opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <style>
      .blk{stroke:#ffffff;stroke-opacity:0.18;stroke-width:1}
      .bn{fill:#ffffff;font-size:17px;font-weight:600;text-anchor:middle}
      .bs{fill:#ffffff;fill-opacity:0.72;font-size:12px;text-anchor:middle}
      .stat{fill:#f5f5f7;font-size:40px;font-weight:700;text-anchor:middle}
      .statl{fill:#86868b;font-size:14px;text-anchor:middle}
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#000000"/>

  <!-- header -->
  <text x="700" y="88" text-anchor="middle" style="font-size:52px;font-weight:700;fill:url(#title)">Venom Extended</text>
  <text x="700" y="126" text-anchor="middle" style="font-size:19px;fill:#a1a1a6">An 8-bit CPU core, designed by hand in Verilog.</text>

  <!-- ambient glow -->
  <ellipse cx="700" cy="500" rx="420" ry="260" fill="#6a4cff" fill-opacity="0.22" filter="url(#glow)"/>

  <!-- package -->
  <rect x="190" y="170" width="1020" height="660" rx="34" fill="url(#pkg)"/>
  <rect x="190" y="170" width="1020" height="660" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="214" y="194" width="972" height="22" fill="url(#pins)"/>
  <rect x="214" y="784" width="972" height="22" fill="url(#pins)"/>
  <rect x="214" y="226" width="22" height="548" fill="url(#pins)"/>
  <rect x="1164" y="226" width="22" height="548" fill="url(#pins)"/>

  <!-- die -->
  <rect x="246" y="226" width="908" height="548" rx="10" fill="url(#die)" filter="url(#soft)"/>
  <rect x="246" y="226" width="908" height="548" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- row 1 -->
  <rect x="266" y="246" width="150" height="160" rx="6" fill="url(#gBlue)" class="blk"/>
  <rect x="266" y="246" width="150" height="160" rx="6" fill="url(#logic)"/>
  <text x="341" y="318" class="bn">Fetch</text>
  <text x="341" y="338" class="bs">PC · fetchreg</text>

  <rect x="426" y="246" width="300" height="160" rx="6" fill="url(#gBlue)" class="blk" opacity="0.85"/>
  <rect x="426" y="246" width="300" height="160" rx="6" fill="url(#sram)"/>
  <text x="576" y="318" class="bn">Instruction Memory</text>
  <text x="576" y="338" class="bs">256 × 21-bit</text>

  <rect x="736" y="246" width="200" height="160" rx="6" fill="url(#gOrange)" class="blk"/>
  <rect x="736" y="246" width="200" height="160" rx="6" fill="url(#logic)"/>
  <text x="836" y="318" class="bn">Decode</text>
  <text x="836" y="338" class="bs">control unit · 16 opcodes</text>

  <rect x="946" y="246" width="188" height="160" rx="6" fill="url(#gYellow)" class="blk"/>
  <rect x="946" y="246" width="188" height="160" rx="6" fill="url(#logic)"/>
  <text x="1040" y="310" class="bn">Hazard Unit</text>
  <text x="1040" y="330" class="bs">stall · load-use</text>
  <text x="1040" y="346" class="bs">branch flush</text>

  <!-- row 2 -->
  <rect x="266" y="416" width="230" height="170" rx="6" fill="url(#gGreen)" class="blk"/>
  <rect x="266" y="416" width="230" height="170" rx="6" fill="url(#sram)"/>
  <text x="381" y="494" class="bn">Register File</text>
  <text x="381" y="514" class="bs">R0 – R7 · 8 × 8-bit</text>

  <rect x="506" y="416" width="330" height="170" rx="6" fill="url(#gPurple)" class="blk"/>
  <rect x="506" y="416" width="330" height="170" rx="6" fill="url(#logic)"/>
  <text x="671" y="494" class="bn">ALU</text>
  <text x="671" y="514" class="bs">add · sub · and · or · xor · zero flag</text>

  <rect x="846" y="416" width="140" height="80" rx="6" fill="url(#gPink)" class="blk"/>
  <rect x="846" y="416" width="140" height="80" rx="6" fill="url(#logic)"/>
  <text x="916" y="452" class="bn">MUL</text>
  <text x="916" y="472" class="bs">shift-add</text>
  <rect x="846" y="506" width="140" height="80" rx="6" fill="url(#gPink)" class="blk"/>
  <rect x="846" y="506" width="140" height="80" rx="6" fill="url(#logic)"/>
  <text x="916" y="542" class="bn">DIV</text>
  <text x="916" y="562" class="bs">repeated sub</text>

  <rect x="996" y="416" width="138" height="170" rx="6" fill="url(#gYellow)" class="blk" opacity="0.8"/>
  <rect x="996" y="416" width="138" height="170" rx="6" fill="url(#logic)"/>
  <text x="1065" y="490" class="bn">Forwarding</text>
  <text x="1065" y="510" class="bs">MEM → EX</text>
  <text x="1065" y="526" class="bs">WB → EX · WB → ID</text>

  <!-- row 3 -->
  <rect x="266" y="596" width="470" height="158" rx="6" fill="url(#gCyan)" class="blk"/>
  <rect x="266" y="596" width="470" height="158" rx="6" fill="url(#sram)"/>
  <text x="501" y="668" class="bn">Data Memory</text>
  <text x="501" y="688" class="bs">256 bytes · LOAD / STORE</text>

  <rect x="746" y="596" width="190" height="158" rx="6" fill="url(#gGreen)" class="blk" opacity="0.8"/>
  <rect x="746" y="596" width="190" height="158" rx="6" fill="url(#logic)"/>
  <text x="841" y="668" class="bn">Write-back</text>
  <text x="841" y="688" class="bs">3-input mux</text>

  <rect x="946" y="596" width="188" height="158" rx="6" fill="url(#gGray)" class="blk"/>
  <rect x="946" y="596" width="188" height="158" rx="6" fill="url(#logic)"/>
  <text x="1040" y="660" class="bn">Clock &amp; I/O</text>
  <text x="1040" y="680" class="bs">divider · reset</text>
  <text x="1040" y="696" class="bs">R1 → LEDs</text>

  <!-- stats -->
  <line x1="190" y1="868" x2="1210" y2="868" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="317" y="926" class="stat">5</text>
  <text x="317" y="954" class="statl">pipeline stages</text>
  <text x="572" y="926" class="stat">8-bit</text>
  <text x="572" y="954" class="statl">datapath · 8 registers</text>
  <text x="827" y="926" class="stat">16</text>
  <text x="827" y="954" class="statl">instructions</text>
  <text x="1082" y="926" class="stat">95 MHz</text>
  <text x="1082" y="954" class="statl">Fmax on Tang Nano 20K</text>
</svg>
